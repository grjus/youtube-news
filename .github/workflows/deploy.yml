name: Deploy Youtube News

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # required for OIDC
  contents: read  # required for actions/checkout

jobs:
  build-and-diff:
    name: Build & CDK Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure AWS Credentials (Diff Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-diff-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Test
        run: |
          pnpm lint
          pnpm format:check
          pnpm build
          pnpm test

      - name: CDK Diff
        run: pnpm cdk diff -c stack=YoutubeNewsStack

  deploy:
    name: Build & CDK Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "::error::AWS_ACCOUNT_ID secret is empty!"
            exit 1
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::AWS_REGION variable is empty!"
            exit 1
          fi
          echo "AWS Account ID length: ${#${{ secrets.AWS_ACCOUNT_ID }}}"
          echo "AWS Region: ${{ vars.AWS_REGION }}"
          echo "Github Repository: ${{ github.repository }}"

      - name: Configure AWS Credentials (Deploy Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Test
        run: |
          pnpm lint
          pnpm format:check
          pnpm build
          pnpm test

      - name: CDK Deploy
        run: pnpm cdk deploy -c stack=YoutubeNewsStack --require-approval never
